{% extends "layout.html" %}
{% block content %}
<h2>Замена букв</h2>
<section class="substitution-section">
    <form method="post">
        <label for="input_text">Введите текст:</label><br>
        <textarea id="input_text" name="input_text" rows="6" cols="60" required>{{ original_text }}</textarea>
        <br><br>

        <label for="letter_from">Буква для замены:</label>
        <input type="text" id="letter_from" name="letter_from" maxlength="1" required>

        <label for="letter_to">На букву:</label>
        <input type="text" id="letter_to" name="letter_to" maxlength="1" required>

        <br><br>
        <button type="submit">Произвести замену</button>
    </form>

    {% if result_text %}
        <h3>Результат замены:</h3>
        <pre>{{ result_text }}</pre>
    {% endif %}
</section>
{% endblock %}
