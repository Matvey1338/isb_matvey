{% extends 'base.html' %}
{% block content %}
<h2>Шифрование файла</h2>
<form method="post" enctype="multipart/form-data">
  <div class="mb-3">
    <label>Выберите способ ввода:</label>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="input_type" id="fileInput" value="file" checked>
      <label class="form-check-label" for="fileInput">Загрузить файл</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="input_type" id="textInput" value="text">
      <label class="form-check-label" for="textInput">Ввести текст</label>
    </div>
  </div>
  <div class="mb-3" id="fileInputDiv">
    <label>Выберите файл</label>
    <input type="file" name="file" class="form-control">
  </div>
  <div class="mb-3" id="textInputDiv" style="display: none;">
    <label>Введите текст</label>
    <textarea name="text" class="form-control" rows="5"></textarea>
  </div>
  <div class="mb-3">
    <label>Режим шифрования</label>
    <select name="encryption_mode" class="form-control">
      <option value="CBC">CBC (Cipher Block Chaining)</option>
      <option value="ECB">ECB (Electronic Codebook)</option>
      <option value="CFB">CFB (Cipher Feedback)</option>
      <option value="OFB">OFB (Output Feedback)</option>
    </select>
  </div>
  <div class="mb-3">
    <label>Имя выходного файла</label>
    <input name="output_name" class="form-control" value="encrypted.bin">
  </div>
  <div class="mb-3">
    <label>Путь к приватному ключу</label>
    <input name="private_key_path" class="form-control" value="keys/private.pem">
  </div>
  <div class="mb-3">
    <label>Путь к зашифрованному симметричному ключу</label>
    <input name="sym_key_path" class="form-control" value="keys/sym_key.enc">
  </div>
  <button class="btn btn-primary">Зашифровать</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const fileInput = document.getElementById('fileInput');
    const textInput = document.getElementById('textInput');
    const fileInputDiv = document.getElementById('fileInputDiv');
    const textInputDiv = document.getElementById('textInputDiv');

    fileInput.addEventListener('change', function() {
        if (this.checked) {
            fileInputDiv.style.display = 'block';
            textInputDiv.style.display = 'none';
            document.querySelector('input[name="file"]').required = true;
            document.querySelector('textarea[name="text"]').required = false;
        }
    });

    textInput.addEventListener('change', function() {
        if (this.checked) {
            fileInputDiv.style.display = 'none';
            textInputDiv.style.display = 'block';
            document.querySelector('input[name="file"]').required = false;
            document.querySelector('textarea[name="text"]').required = true;
        }
    });
});
</script>
{% endblock %}
